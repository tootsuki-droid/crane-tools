lor:var(--muted)}.nowlbl b{color:var(--ink)}#jsWarn{opacity:0;max-height:0;overflow:hidden;margin:0;padding:0 14px;animation:.4s 1.2s forwards jsWarnIn;background:#fae9e7;border:1px solid #e5beb9;border-left:4px solid #a32d2d;color:#a32d2d;border-radius:8px;font-size:13.5px;line-height:1.75}#jsWarn b{font-size:14px}@keyframes jsWarnIn{to{opacity:1;max-height:260px;padding:12px 14px;margin:12px 0 4px}}.cred{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:right}</style>

      <h1>鉄板の荷重分散ツール（統合版）</h1>
      <p>用途に合わせてツールを選んでください。鉄板にかかる力が下の地盤へどのように伝わるか（地盤反力の分布・沈下量など）を概算します。</p>

      <h2>ジャッキ・フロート用</h2>
      <p>油圧ジャッキなどのジャッキ反力を、フロート（受け板）と敷鉄板で地盤へ分散させる場合。フロート矩形／円形、専用鉄板の追加に対応。</p>

    </button>

      <h2>クローラークレーン用</h2>
      <p>クローラークレーンの接地圧を敷鉄板で地盤へ分散させる場合。最大接地圧の直接入力に加え、日本建設機械化協会方式による接地圧の計算（旋回・偏心）にも対応。</p>
