<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定格荷重検索ツール｜加藤製作所 ATF-100G-4（J）</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--line:#334155;--txt:#e2e8f0;--sub:#94a3b8;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--err:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;}
.wrap{max-width:1120px;margin:0 auto;padding:16px;}
header{border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:16px;}
header h1{font-size:20px;margin:0 0 6px;}
header .meta{font-size:12px;color:var(--sub);}
header .meta b{color:var(--txt);}
.modebar{display:flex;gap:8px;margin:14px 0;}
.modebtn{flex:1;text-align:center;padding:11px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;}
.modebtn.active{background:var(--accent);color:#04263a;border-color:var(--accent);}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;}
.tab{padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;}
.tab.active{background:var(--accent);color:#04263a;font-weight:700;border-color:var(--accent);}
.seg{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg div{padding:7px 14px;cursor:pointer;font-size:13px;background:var(--card2);}
.seg div.active{background:var(--accent);color:#04263a;font-weight:700;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
.selrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
.field{flex:1 1 170px;min-width:140px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
select,input[type=number]{width:100%;padding:9px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;font-size:14px;}
select:disabled{opacity:.4;}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;padding-bottom:9px;}
.chk input{width:17px;height:17px;}
.result{background:linear-gradient(135deg,#0c4a6e,#155e75);border-radius:12px;padding:20px;text-align:center;margin-bottom:12px;}
.result .lbl{font-size:13px;color:#bae6fd;}
.result .val{font-size:44px;font-weight:800;letter-spacing:1px;margin:4px 0;}
.result .val.err{font-size:22px;color:#fecaca;}
.result .val .u{font-size:20px;font-weight:600;}
.result .note{font-size:12px;color:#e0f2fe;}
.result.err{background:linear-gradient(135deg,#7f1d1d,#991b1b);}
.result.net{background:linear-gradient(135deg,#14532d,#166534);margin-top:10px;}
.result.warn{background:linear-gradient(135deg,#78350f,#92400e);}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:center;}
th{background:var(--card2);color:var(--sub);position:sticky;top:0;}
tr.hl td{background:#0e7490;color:#fff;font-weight:700;}
.tablewrap{max-height:460px;overflow:auto;border-radius:8px;}
.config{font-size:12px;color:var(--sub);margin:8px 0;}
.config b{color:var(--accent);}
.infoline{font-size:12px;color:var(--sub);margin:6px 0;padding:8px 10px;background:var(--card2);border-left:4px solid var(--accent);border-radius:0 6px 6px 0;}
.infoline b{color:var(--accent);}
.infoline.alert{border-left-color:var(--warn);color:var(--warn);}
.infoline.alert b{color:var(--warn);}
footer{font-size:11px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;margin-top:8px;}
footer .warnbox{background:#422006;border:1px solid #92400e;color:#fde68a;padding:10px;border-radius:8px;margin-bottom:8px;}
.count{font-size:11px;color:var(--sub);text-align:right;margin-top:4px;}
.rev th,.rev td{text-align:left;font-size:12px;}
.rev td.num,.rev th.num{text-align:right;white-space:nowrap;}
.margin{color:var(--ok);font-weight:700;}
.hint{font-size:12px;color:var(--sub);margin:6px 0;}
.cap{color:var(--warn);font-weight:700;}
</style>

:root{--bg:#fff;--card:#fff;--card2:#eef3f9;--line:#d5dfe9;
 --txt:#222222;--sub:#6b7a8a;--accent:#2d6cb5;--ok:#1e7e34;--warn:#b8860b;--err:#c0392b;}
body{background:#fff;color:#222222;}
header{border-bottom:1px solid #d5dfe9;}
header h1{color:#1B2DB8;}
header .meta b{color:#222222;}
.modebtn{background:#fff;border:1px solid #d5dfe9;color:#1a3a5c;}
.modebtn.active{background:#2d6cb5;color:#fff;border-color:#245a99;}
.tab{background:#fff;border:1px solid #d5dfe9;color:#1a3a5c;}
.tab.active{background:#1a3a5c;color:#fff;border-color:#1a3a5c;}
.seg{border:1px solid #d5dfe9;}
.seg div{background:#eef3f9;color:#1a3a5c;}
.seg div.active{background:#2d6cb5;color:#fff;}
.panel{background:#fff;border:1px solid #d5dfe9;}
.field label{color:#6b7a8a;}
select,input[type=number]{background:#fff;color:#222222;border:1px solid #d5dfe9;}
select:disabled{opacity:.45;background:#eef3f9;}
.result{background:linear-gradient(135deg,#1a3a5c,#2d6cb5);color:#fff;}
.result .lbl{color:#cfe0f2;}
.result .note{color:#e2ecf7;}
.result .val.err{color:#ffe1dc;}
.result.err{background:linear-gradient(135deg,#8e2b21,#c0392b);}
.result.net{background:linear-gradient(135deg,#155e2c,#1e7e34);}
.result.warn{background:linear-gradient(135deg,#8a6708,#b8860b);}
table{background:#fff;}
th,td{border:1px solid #d5dfe9;}
th{background:#eef3f9;color:#1a3a5c;}
tr.hl td{background:#eaf6ec;color:#14532d;font-weight:700;}
.tablewrap{border:1px solid #d5dfe9;}
.config{color:#6b7a8a;}
.config b{color:#2d6cb5;}
footer{color:#6b7a8a;border-top:1px solid #d5dfe9;}
footer .warnbox{background:#fff8e6;border:1px solid #e8d9a0;color:#5a4a12;}
footer .warnbox b{color:#8a6708;}
.count,.hint{color:#6b7a8a;}
.margin{color:#1e7e34;}

/* ===== 白背景ロゴ入り版：作成者クレジット ===== */
body::after{
  content:"城西運輸機工㈱　技術計画課　大月敬之";
  display:block;box-sizing:border-box;
  max-width:1120px;margin:0 auto;padding:10px 18px 22px;
  text-align:right;font-size:12px;color:#555;
  font-family:"Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1 id="title"></h1>
<div class="meta" id="metaline"></div>
</header>

<div class="modebar" id="modebar">
  <div class="modebtn active" data-mode="fwd">順引き（構成 → 荷重）</div>
  <div class="modebtn" data-mode="rev">逆引き（荷重 → 構成）</div>
</div>

<div class="panel" id="optbar">
  <div class="selrow">
    <div class="field" style="max-width:250px;">
      <label>フック（定格総荷重から差引）</label>
      <select id="hookSel"></select>
    </div>
    <div class="field" style="max-width:210px;">
      <label>巻上ロープ掛数（上限）</label>
      <select id="fallSel"></select>
    </div>
    <div class="field" style="max-width:165px;">
      <label>フック質量 直接入力 (kg)</label>
      <input type="number" id="hookKgInp" step="10" min="0" placeholder="一覧に無い場合">
    </div>
    <div class="field" style="max-width:150px;">
      <label>つり具質量 (kg)</label>
      <input type="number" id="gearInp" step="10" min="0" placeholder="例: 200">
    </div>
  </div>
  <div class="hint" id="optHint">フックを選ぶと、定格総荷重からフック質量・つり具質量を差し引いた正味の吊上可能質量を表示します（逆引きでは「必要な定格総荷重」に加算）。本機の原本には「掛数→最大荷重」の制限表がないため、掛数の選択肢は表示されません（巻掛本数は構成ごとに注記で表示します）。</div>
</div>

<!-- 順引き -->
<div id="fwdArea">
  <div class="tabs" id="tabs"></div>
  <div class="panel"><div class="selrow" id="selectors"></div>
    <div class="selrow" id="dedrow" style="margin-top:12px;"></div>
  </div>
  <div id="output"></div>
</div>

<!-- 逆引き -->
<div id="revArea" style="display:none;">
  <div class="panel">
    <div class="selrow">
      <div class="field" style="flex:0 0 auto;">

    s.onchange=()=>{ sel[p]=s.value||null; f.params.slice(pi+1).forEach(pp=>sel[pp]=null); renderSelectors(); renderFalls(); renderOutput(); };
    fld.appendChild(s); box.appendChild(fld);
  });
  const fld=el('div','field'); fld.appendChild(el('label',null,'作業半径 (m)'));
  const inp=document.createElement('input'); inp.type='number'; inp.step='0.1'; inp.min='0'; inp.placeholder='例: 12.5';
  if(radius!=null) inp.value=radius; inp.oninput=()=>{radius=inp.value===''?null:parseFloat(inp.value);renderOutput();};
  fld.appendChild(inp); box.appendChild(fld);
}
function renderDed(){
  const box=document.getElementById('dedrow'); box.innerHTML=''; const f=fam();
  const l=dedList(f); if(!l){ box.style.display='none'; return; }
  box.style.display='';
  const fld=el('div','field'); fld.style.maxWidth='330px';
  fld.appendChild(el('label',null,'ジブ・補助ジブの装着（主フックの定格総荷重から減算）'));
  const s=document.createElement('select');
  l.forEach(x=>{ const o=el('option',null,x.t>0?`${x.name}（−${x.t.toFixed(1)} t）`:x.name); o.value=x.name;
    if(x.name===dedName[f.name])o.selected=true; s.appendChild(o); });
  if(!dedName[f.name]) dedName[f.name]=l[0].name;
  s.onchange=()=>{dedName[f.name]=s.value;renderOutput();renderRev();};
  fld.appendChild(s); box.appendChild(fld);
  const h=el('div','hint',(DATA.meta.dedNote||{})[f.name]||''); h.style.flex='1 1 100%'; box.appendChild(h);
}
function renderOutput(){
  const out=document.getElementById('output'); if(!out) return; out.innerHTML=''; const f=fam();
  const an=(DATA.meta.attachNote||{})[f.name];
  if(an){ const d=el('div','infoline'); d.innerHTML=an; out.appendChild(d); }
  if(!f.params.every(p=>sel[p]!=null)){ out.appendChild(el('div','config','▲ 構成をすべて選択してください。')); return; }
  const ser=findSeries();
  if(!ser){ const d=el('div','result err');d.appendChild(el('div','val err','設定なし（この組合せの荷重表はありません）'));out.appendChild(d);return; }
  const cfg=el('div','config'); cfg.innerHTML='構成: '+f.params.map(p=>`${p}=<b>${sel[p]}</b>`).join(' ／ ')+`　<span style="opacity:.75">（原本 ${ser.src}）</span>`; out.appendChild(cfg);
  if(ser.hookNote){ const d=el('div','infoline alert'); d.innerHTML=ser.hookNote; out.appendChild(d); }
  if(radius!=null && !isNaN(radius)){
    const r=lookup(ser.data,radius); let d;
    if(r.status==='ok'){
      const e=eff(r.load,f);
      d=el('div','result'); d.appendChild(el('div','lbl','定格総荷重'));
      const v=el('div','val'); v.innerHTML=`${fmtL(e.v)}<span class="u"> t</span>`; d.appendChild(v);
      let note = Math.abs(r.adopted-radius)>1e-9?`入力半径 ${radius} m → 採用半径 ${fmtR(r.adopted)} m（次に大きい半径の値＝安全側を採用）`:`作業半径 ${fmtR(r.adopted)} m`;
      if(r.ang!=null) note+=` ／ ブーム角度 ${r.ang.toFixed(1)}°`;
      if(e.capped) note+=` ／ 表の値 ${fmtL(r.load)} t を ${fallName} の上限 ${e.cap} t で頭打ち`;
      if(e.ded>0) note+=` ／ ${dedName[f.name]} により −${e.ded.toFixed(1)} t`;
      d.appendChild(el('div','note',note));
    }else if(r.status==='under'){ d=el('div','result warn'); d.appendChild(el('div','val err',`範囲外（最小半径 ${fmtR(r.rmin)} m 未満）`)); }
    else if(r.status==='over'){ d=el('div','result err'); d.appendChild(el('div','val err',`吊り上げ不可（最大半径 ${fmtR(r.rmax)} m 超過）`)); }
    else { d=el('div','result err'); d.appendChild(el('div','val err','設定なし')); }
    out.appendChild(d);
    if(r.status==='ok' && deductT()>0){
      const e=eff(r.load,f); const net=+(e.v-deductT()).toFixed(4);
      const mn=minNet(f); const low=(mn>0 && net>0 && net<mn-1e-9);
      const nl=el('div','result '+(net>0?(low?'warn':'net'):'err'));
      nl.appendChild(el('div','lbl','正味吊上可能質量（フック・つり具 差引後）'));
      const nv=el('div','val'+(net>0?'':' err'));
      if(net>0){ nv.innerHTML=`${fmtL(net)}<span class="u"> t</span>`; } else { nv.textContent='フック・つり具質量が定格総荷重を上回ります'; }
      nl.appendChild(nv);
      let nn=`定格総荷重 ${fmtL(e.v)} t − ${hookNote()}`;
      if(low) nn+=` ／ ⚠ 原本注記2：差し引き後が ${mn.toFixed(1)} t を下回る範囲は作業できません`;
      nl.appendChild(el('div','note',nn));
      out.appendChild(nl);
    }
  }
  const hasAng=ser.data.some(row=>row.length>2&&row[2]!=null);
  const tw=el('div','tablewrap'); const tb=document.createElement('table');
  const hr=document.createElement('tr'); hr.appendChild(el('th',null,'作業半径 (m)')); hr.appendChild(el('th',null,'定格総荷重 (t)'));
  if(hasAng) hr.appendChild(el('th',null,'ブーム角度 (°)'));
  tb.appendChild(hr);
  let hlR=null; if(radius!=null && !isNaN(radius)){const r=lookup(ser.data,radius); if(r.status==='ok') hlR=r.adopted;}
  ser.data.forEach(row=>{ const tr=document.createElement('tr'); if(row[0]===hlR)tr.className='hl';
    const e=eff(row[1],f);
    tr.appendChild(el('td',null,fmtR(row[0])));
    const td=el('td',null,fmtL(e.v)); if(e.capped||e.ded>0) td.className='cap';
    tr.appendChild(td);
    if(hasAng) tr.appendChild(el('td',null,row[2]!=null?row[2].toFixed(1):'―'));
    tb.appendChild(tr); });
  tw.appendChild(tb); out.appendChild(tw);
  out.appendChild(el('div','count',`${ser.data.length} 行 ／ ${ser.cw||'―'}`));
}

/* ---------- 逆引き ---------- */
function famList(){ return DATA.families.filter(f=> revFam==='すべて' || f.name===revFam); }
function renderRevControls(){
  document.getElementById('revRadiusField').style.display = revMode==='lr'?'':'none';
  document.querySelectorAll('#revseg div').forEach(d=>d.classList.toggle('active',d.dataset.rm===revMode));
  const hk = deductT()>0 ? '　フック選択中：入力は「実荷重（つり荷）」として扱い、フック・つり具質量を加えた必要定格総荷重で判定します。' : '';
  const fk = fallName ? `　掛数「${fallName}」を選択中：その掛数の上限で頭打ちにして判定します。` : '';
  document.getElementById('revHint').textContent = (revMode==='lr'
    ? '指定した作業半径で、入力荷重以上を吊れる構成を余裕の大きい順に一覧します（採用半径＝入力半径以上の最初の行＝安全側）。'
    : '入力荷重を吊れる最大作業半径を構成ごとに求め、最大半径の大きい順に一覧します。') + hk + fk;
}
const CAP=400;
function renderRev(){
  renderRevControls();
  const out=document.getElementById('revOutput'); if(!out) return; out.innerHTML='';
  if(revLoad==null || isNaN(revLoad) || revLoad<=0){ out.appendChild(el('div','config','▲ 吊りたい荷重を入力してください。')); return; }
  if(revMode==='lr' && (revRadius==null || isNaN(revRadius) || revRadius<0)){ out.appendChild(el('div','config','▲ 作業半径を入力してください。')); return; }
  const need=+(revLoad+deductT()).toFixed(4);
  const rows=[];
  famList().forEach(f=>{
    f.series.forEach(s=>{
      if(revMode==='lr'){
        const r=lookup(s.data,revRadius);
        if(r.status==='ok'){ const e=eff(r.load,f);
          if(e.v+1e-9>=need) rows.push({fam:f.name,cfg:cfgLabel(s),load:e.v,adopted:r.adopted,margin:+(e.v-need).toFixed(4),src:s.src});
        }
      }else{
        const b=maxRadiusFor(s,f,need);
        if(b){ rows.push({fam:f.name,cfg:cfgLabel(s),maxr:b.r,loadAtMax:b.l,src:s.src}); }
      }
    });
  });
  if(!rows.length){ const d=el('div','result err'); d.appendChild(el('div','val err','該当する構成がありません'));
    out.appendChild(d); return; }
  if(revMode==='lr') rows.sort((a,b)=>b.margin-a.margin || b.load-a.load);
  else rows.sort((a,b)=>b.maxr-a.maxr || b.loadAtMax-a.loadAtMax);
  const shown=rows.slice(0,CAP);
  const head=el('div','result'); head.appendChild(el('div','lbl','該当構成'));
  const v=el('div','val'); v.innerHTML=`${rows.length}<span class="u"> 件</span>`; head.appendChild(v);
  const needTxt = deductT()>0 ? `（実荷重 ${revLoad} t ＋ ${hookNote()} ＝ 必要定格総荷重 ${fmtL(need)} t）` : '';
  head.appendChild(el('div','note', (revMode==='lr'?`作業半径 ${revRadius} m で ${fmtL(need)} t 以上を吊れる構成`:`${fmtL(need)} t を吊れる構成と最大作業半径`)+needTxt ));
  out.appendChild(head);
  const tw=el('div','tablewrap'); const tb=document.createElement('table'); tb.className='rev';
  const hr=document.createElement('tr');
  ['アタッチメント','構成'].forEach(h=>hr.appendChild(el('th',null,h)));
  if(revMode==='lr'){ hr.appendChild(el('th','num','採用半径(m)')); hr.appendChild(el('th','num','定格総荷重(t)')); hr.appendChild(el('th','num','余裕(t)')); }
  else { hr.appendChild(el('th','num','最大作業半径(m)')); hr.appendChild(el('th','num','その荷重(t)')); }
  hr.appendChild(el('th',null,'原本'));
  tb.appendChild(hr);
  shown.forEach(r=>{
    const tr=document.createElement('tr');
    tr.appendChild(el('td',null,r.fam)); tr.appendChild(el('td',null,r.cfg));
    if(revMode==='lr'){ tr.appendChild(el('td','num',fmtR(r.adopted))); tr.appendChild(el('td','num',fmtL(r.load)));
      tr.appendChild(el('td','num margin','+'+fmtL(r.margin))); }
    else { tr.appendChild(el('td','num',fmtR(r.maxr))); tr.appendChild(el('td','num',fmtL(r.loadAtMax))); }
    tr.appendChild(el('td',null,r.src||''));
    tb.appendChild(tr);
  });
  tw.appendChild(tb); out.appendChild(tw);
  out.appendChild(el('div','count', rows.length>CAP?`全 ${rows.length} 件中 上位 ${CAP} 件を表示`:`${rows.length} 件`));
}

/* ---------- モード切替・初期化 ---------- */
function setMode(m){
  mode=m;
  document.querySelectorAll('#modebar .modebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  document.getElementById('fwdArea').style.display = m==='fwd'?'':'none';
  document.getElementById('revArea').style.display = m==='rev'?'':'none';
  if(m==='rev') renderRev();
}
function fallOptions(){
  const names=[];
  const add=t=>{ if(t) t.forEach(([n,v])=>{ const s=String(n)+'本掛（最大巻上荷重 '+v+' t）'; if(!names.includes(s)) names.push(s); }); };
  if(mode==='fwd') add(fallTable(fam()));
  else famList().forEach(f=>add(fallTable(f)));
  names.sort((a,b)=>parseInt(a)-parseInt(b));
  return names;
}
function renderFalls(){
  const fs=document.getElementById('fallSel'); if(!fs) return;
  const opts=fallOptions(); fs.innerHTML='';
  const empty = 'この系統は掛数の制限表がありません';
  const o0=el('option',null,opts.length?'指定なし（上限を適用しない）':empty); o0.value=''; fs.appendChild(o0);
  opts.forEach(n=>{ const o=el('option',null,n); o.value=n; if(n===fallName)o.selected=true; fs.appendChild(o); });
  if(!opts.includes(fallName)) fallName='';
  fs.disabled=!opts.length;
}
function init(){
  const m=DATA.meta;
  document.getElementById('title').textContent=`定格荷重検索ツール｜${m.maker} ${m.model}`;
  document.getElementById('metaline').innerHTML = m.books.map(b=>
     `<b>${b.name}</b>　${b.book}　発行 ${b.date}`).join('<br>')+`　／　単位 <b>${m.unit}</b>　／　${m.cw}`;
  document.getElementById('warnbox').innerHTML=m.warn;
  document.getElementById('footnotes').innerHTML=m.foot;
  document.querySelectorAll('#modebar .modebtn').forEach(b=>b.onclick=()=>{setMode(b.dataset.mode);renderFalls();});
  document.querySelectorAll('#revseg div').forEach(d=>d.onclick=()=>{revMode=d.dataset.rm;renderRev();});
  document.getElementById('revLoad').oninput=e=>{revLoad=e.target.value===''?null:parseFloat(e.target.value);renderRev();};
  document.getElementById('revRadius').oninput=e=>{revRadius=e.target.value===''?null:parseFloat(e.target.value);renderRev();};
  const rf=document.getElementById('revFam'); const ro=el('option',null,'すべて'); ro.value='すべて'; rf.appendChild(ro);
  DATA.families.forEach(f=>{const o=el('option',null,f.name);o.value=f.name;rf.appendChild(o);});
  rf.onchange=e=>{revFam=e.target.value;renderFalls();renderRev();};
  const hs=document.getElementById('hookSel');
  const none=el('option',null,'なし（定格総荷重そのまま）'); none.value=''; hs.appendChild(none);
  (m.hooks||[]).forEach(h=>{const o=el('option',null,`${h.name}（${h.kg.toLocaleString()} kg）`);o.value=h.name;hs.appendChild(o);});
  hs.onchange=e=>{hookName=e.target.value; renderFalls(); renderOutput(); renderRev();};
  document.getElementById('fallSel').onchange=e=>{fallName=e.target.value; renderOutput(); renderRev();};
  document.getElementById('hookKgInp').oninput=e=>{hookKgManual=e.target.value===''?0:(parseFloat(e.target.value)||0); renderOutput(); renderRev();};
  document.getElementById('gearInp').oninput=e=>{gearKg=e.target.value===''?0:(parseFloat(e.target.value)||0); renderOutput(); renderRev();};
  renderTabs(); renderSelectors(); renderDed(); renderFalls(); renderOutput();
}
try{ if(DATA){ init(); } else if(!_errShown){ if(window.onerror) window.onerror('データを読み込めなかったため表示を中断しました。',' ',0,0,null); } }
catch(e){ if(window.onerror) window.onerror('初期化エラー: '+((e&&e.message)||String(e))+((e&&e.stack)?('\n'+e.stack):''),'',0,0,e); }
</script>

<script id="pdf-export">(function(){
if(window.__pdfx__)return;window.__pdfx__=1;

function T(e){return e?(e.textContent||'').replace(/\s+/g,' ').trim():'';}
function ESC(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function VAL(c){
  if(!c)return '';
  if(c.tagName==='SELECT'){var o=c.options[c.selectedIndex];return o?T(o):'';}
  if(c.type==='checkbox'||c.type==='radio')return c.checked?'あり':'';
  return (c.value||'').trim();
}
function NOW(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
var HIDDEN=[];
function HIDE(list){UNHIDE();for(var i=0;i<list.length;i++){if(!list[i])continue;
  list[i].className=list[i].className+' pdfx-hide';HIDDEN.push(list[i]);}}
function UNHIDE(){for(var i=0;i<HIDDEN.length;i++){
  HIDDEN[i].className=HIDDEN[i].className.replace(/\s*pdfx-hide/g,'');}HIDDEN=[];}
function SHEET(rows,before){
  var s=document.getElementById('pdfxSheet');
  if(!s){s=document.createElement('div');s.id='pdfxSheet';}
  var h='<div class="pdfxttl">検索条件</div><table>';
  for(var i=0;i<rows.length;i++){h+='<tr><th>'+ESC(rows[i][0])+'</th><td>'+ESC(rows[i][1])+'</td></tr>';}
  s.innerHTML=h+'</table>';
  if(before&&before.parentNode){before.parentNode.insertBefore(s,before);}
  else{(document.body||document.documentElement).appendChild(s);}
  return s;
}
function BIND(prep,undo){
  if(window.addEventListener){
    window.addEventListener('beforeprint',function(){try{prep();}catch(e){}});
    window.addEventListener('afterprint',function(){try{undo();}catch(e){}});
  }
  if(window.matchMedia){
    var mq=window.matchMedia('print');
    var f=function(m){try{if(m.matches)prep();else undo();}catch(e){}};
    if(mq.addEventListener)mq.addEventListener('change',f);
    else if(mq.addListener)mq.addListener(f);
  }
  var b=document.createElement('button');
  b.id='pdfxBtn';b.type='button';b.textContent='PDF出力（印刷）';
  b.title='印刷ダイアログで「送信先／プリンター」を「PDFとして保存」にすると、A4縦のPDFになります。';
  b.onclick=function(){try{prep();}catch(e){}window.print();};
  (document.body||document.documentElement).appendChild(b);
}

function fields(root,rows){
  if(!root)return;
  var fs=root.querySelectorAll('.field');
  for(var i=0;i<fs.length;i++){
    var lb=fs[i].querySelector('label');if(!lb)continue;
    var seg=fs[i].querySelector('.seg .active');
    var v=seg?T(seg):VAL(fs[i].querySelector('select,input,textarea'));
    if(!v||v==='― 選択 ―')continue;
    rows.push([T(lb),v]);
  }
}
function isRev(){var r=document.getElementById('revArea');return !!(r&&r.style.display!=='none');}
function rows(){
  var r=[];r.push(['出力日時',NOW()]);
  var mb=document.querySelector('#modebar .modebtn.active');if(mb)r.push(['検索モード',T(mb)]);
  if(isRev()){fields(document.getElementById('revArea'),r);}
  else{
    /* 機種混在ツール（ラフター等）は最上部の機種セレクタを最初に載せる */
    fields(document.getElementById('modelbar'),r);
    var tb=document.querySelector('#tabs .tab.active');if(tb)r.push(['系統',T(tb)]);
    fields(document.getElementById('selectors'),r);
    fields(document.getElementById('dedrow'),r);
  }
  fields(document.getElementById('optbar'),r);
  return r;
}
function panelOf(id){var e=document.getElementById(id);return (e&&e.closest)?e.closest('.panel'):null;}
function prep(){
  SHEET(rows(),document.getElementById(isRev()?'revOutput':'output'));
  HIDE([document.getElementById('modebar'),document.getElementById('optbar'),
        document.getElementById('modelbar'),document.getElementById('tabs'),
        panelOf('selectors'),panelOf('revseg')]);
}
BIND(prep,UNHIDE);
})();</script>
</body>
