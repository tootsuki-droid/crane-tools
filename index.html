<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クレーン関係ツール ポータル｜城西運輸機工㈱ 技術計画課</title>
<style>
:root{--bg:#e9ebee;--card:#ffffff;--card2:#f4f5f7;--line:#ccd2da;
 --txt:#1c2430;--sub:#5f6b7a;--accent:#16305c;--onaccent:#ffffff;
 --sup:#e2700c;--mark:#ffe0bd;--markt:#5a3208;}

*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif; background:var(--bg); color:var(--txt); font-size:14px; line-height:1.6;}
.wrap{max-width:1200px; margin:0 auto; padding:16px;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px;}
.search{position:relative; margin-bottom:12px;}
.search input{width:100%; padding:11px 36px 11px 13px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:var(--card); color:var(--txt); font-family:inherit;}
.search input:focus{outline:none; border-color:var(--accent);}
.search .clr{position:absolute; right:9px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--sub); font-size:20px; cursor:pointer; padding:0 4px; display:none; line-height:1;}
.tabs{display:flex; flex-wrap:wrap; gap:7px;}
.tabs button{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:13px; color:var(--accent); cursor:pointer; font-weight:600; font-family:inherit;}
.tabs button.on{background:var(--accent); color:var(--onaccent); border-color:var(--accent); font-weight:700;}
.tabs button .n{opacity:.75; font-weight:400; margin-left:6px; font-size:11.5px;}
h2.sec{font-size:15px; color:var(--accent); border-left:4px solid var(--accent); padding-left:9px; margin:22px 0 12px; font-weight:700;}
h2.sec .cnt{font-size:12px; color:var(--sub); font-weight:400; margin-left:8px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:12px;}
a.card{display:block; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:13px 15px; text-decoration:none; color:inherit; transition:.12s;}
a.card:hover{border-color:var(--accent); box-shadow:0 3px 12px rgba(0,0,0,.14); transform:translateY(-2px);}
a.card.sup{border-left-color:var(--sup);}
a.card .nm{font-size:15.5px; font-weight:700; color:var(--accent); line-height:1.35;}
a.card .mk{font-size:11.5px; color:var(--sub); font-weight:600; margin-top:5px;}
a.card .nt{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.6;}
.empty{padding:40px 12px; text-align:center; color:var(--sub); font-size:14px;}
.warnbox{border-radius:8px; padding:11px 13px; font-size:12.5px; line-height:1.75; margin-top:20px;}
mark{background:var(--mark); color:var(--markt); padding:0 2px; border-radius:2px;}
@media print{ .search,.tabs{display:none;} a.card{break-inside:avoid;} }
@media(max-width:600px){ .wrap{padding:12px;} }

</style>

  if(!t) return esc(s);
  const i = s.toLowerCase().indexOf(t.toLowerCase());

function match(t, term){

  const hay = (t.name + " " + t.maker + " " + t.note + " " + t.kw + " " + t.f).toLowerCase();

}

}
